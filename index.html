<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard des réservations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Dashboard des réservations</h1>
            <p>Mini application JavaScript</p>
        </header>

        <section class="top-section">
            <div class="card card-form">
                <h2>Nouvelle réservation</h2>
                <div class="form">
                    <input type="text" placeholder="Nom du client" id="client">
                    <input type="date" id="date">
                    <input type="number" placeholder="Nombre de nuits" id="nights" min="1">
                    <button id="add">Ajouter</button>
                    <p id="error" class="error"></p>
                </div>
            </div>

            <div class="card stats-card">
                <h2>Statistiques</h2>
                <div class="stats-grid">
                    <div class="stats-item">
                        <span class="stats-label">Total réservations</span>
                        <span class="stats-value" id="total-reservation">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Total nuits</span>
                        <span class="stats-value" id="total-nights">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Moy. nuits/rés.</span>
                        <span class="stats-value" id="avg-nights">0</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="bottom-section">
            <div class="card card-table">
                <div class="card-header">
                    <h2>Liste des réservations</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Date</th>
                            <th>Nuits</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <div class="card chart-card">
                <div class="card-header">
                    <h2>Graphique : Nuits/Client</h2>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
